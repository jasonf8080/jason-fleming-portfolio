<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 100 100"
  width="100%"
  height="100%"
  preserveAspectRatio="xMidYMid slice"
>
  <defs>
    <mask id="cutout">
      <!-- White = visible (black overlay shows) -->
      <rect width="100%" height="100%" fill="white" />

      <!-- Black = hole (transparent word) -->
      <text
        x="50"
        y="50"
        text-anchor="middle"
        dominant-baseline="middle"
        font-size="15"
        font-weight="700"
        fill="black"
      >
        PROJECTS
      </text>
    </mask>
  </defs>

  <!-- Black overlay with transparent word -->
  <rect width="100%" height="100%" fill="black" mask="url(#cutout)" />
</svg>
